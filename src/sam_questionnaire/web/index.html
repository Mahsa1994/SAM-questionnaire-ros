<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM Questionnaire</title>
<style>
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --text: #1f2328;
  --text-2: #5b6168;
  --text-3: #8a9097;
  --border: #e3dfd8;
  --valence: #1d9e75;
  --arousal: #3a7bd5;
  --dominance: #d0602f;
  --ok: #22a06b;
  --bad: #d64545;
  --shadow: 0 1px 2px rgba(20, 20, 20, .04), 0 4px 16px rgba(20, 20, 20, .05);
  --panel: #faf9f7;
  --line: #8c8780;
  --track: #faf9f7;
  --thumb: #9b3a22;
  --thumb-fill: #faece8;
  --gap: 8px;
  --thumb-w: 46px;
  --thumb-h: 50px;
  --track-h: 20px;
  --page-max: clamp(560px, calc((100dvh - 640px) / 3.25 * 5 + 92px), 860px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --surface: #1e2125;
    --text: #eceef0;
    --text-2: #a9afb6;
    --text-3: #7b828a;
    --border: #2e3237;
    --valence: #3cc394;
    --arousal: #6aa3f0;
    --dominance: #ef8354;
    --shadow: none;
    --panel: #1e2125;
    --line: #5d636a;
    --track: #15171a;
    --thumb: #e3805f;
    --thumb-fill: #3b2621;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.page { max-width: var(--page-max); margin: 0 auto; padding: 12px 16px 12px; }

/* ── header ─────────────────────────────────────────── */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
h1 { font-size: 1.35rem; font-weight: 650; letter-spacing: -.01em; }
.lede { color: var(--text-2); margin-top: 2px; }
.session { position: relative; flex-shrink: 0; }
.session summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: .8rem; color: var(--text-3); padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); user-select: none;
}
.session summary::-webkit-details-marker { display: none; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.status-dot.ok { background: var(--ok); }
.status-dot.warn { background: #e0a100; }
.status-dot.bad { background: var(--bad); }
.session-panel {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 5; width: 290px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12); padding: 14px; display: grid; gap: 10px; font-size: .85rem;
}
.session-panel label { display: grid; gap: 4px; color: var(--text-2); }
.session-panel input[type=text] {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px;
}
.session-panel .check { display: flex; gap: 8px; align-items: center; }
.session-panel .meta { color: var(--text-3); font-size: .78rem; line-height: 1.5; }
.session-panel code { font-size: .75rem; }

/* ── questionnaire panel ────────────────────────────── */
/* Pictogram size: each pictogram is (panel width - gaps) / 5. The panel
   grows with the window height so all three questions fit without
   scrolling where possible (between 560px and 860px wide) - change the
   numbers in --page-max (in :root) to make the pictograms smaller/larger. */
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow); padding: 12px 24px 14px; margin-bottom: 10px;
}
.dim + .dim { margin-top: 10px; }
.dim-q { text-align: center; font-size: 1.2rem; font-weight: 500; margin-bottom: 4px; }

/* figs, slider and ticks share the same inner width (dashed border 1px +
   padding 4px on .figs = 5px inline margin on the others), so the 9 slider
   positions line up with the pictograms: 1,3,5,7,9 = pictogram centres. */
.figs {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap);
  padding: 4px; border: 1px dashed var(--line); border-radius: 12px;
}
.fig { cursor: pointer; border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.fig img {
  display: block; width: 100%; height: auto; border-radius: 10px;
  outline: 3px solid transparent; outline-offset: 1px;
  transition: outline-color .15s ease, transform .15s ease;
}
.fig.near img { outline-color: var(--thumb); }

.slider {
  position: relative; height: var(--thumb-h); margin: 8px 5px 0;
  cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; outline: none;
}
.track {
  position: absolute; left: 0; right: 0; top: 50%; height: var(--track-h); transform: translateY(-50%);
  background: var(--track); border: 1px solid var(--line); border-radius: 999px;
}
.thumb {
  position: absolute; top: 0; width: var(--thumb-w); height: 100%; transform: translateX(-50%);
  background: var(--thumb-fill); border: 2px solid var(--thumb); border-radius: 10px;
  transition: left .12s ease;
}
.slider.unset .thumb { display: none; }
.slider.dragging .thumb { transition: none; }
.slider:focus-visible .track { outline: 3px solid color-mix(in srgb, var(--thumb) 40%, transparent); outline-offset: 3px; }

.ticks { position: relative; height: 16px; margin: 4px 5px 0; }
.tick { position: absolute; top: 0; width: 1px; height: 9px; background: var(--line); }
.tick.major { height: 16px; }

.ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 2px; font-size: .95rem; color: var(--text-2); }
.ends span:last-child { text-align: right; }

/* ── submit ─────────────────────────────────────────── */
.actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.hint { color: var(--text-3); font-size: .9rem; }
button.submit {
  font: inherit; font-weight: 620; font-size: 1.05rem; color: #fff; background: var(--text);
  border: 0; border-radius: 12px; padding: 9px 30px; cursor: pointer; transition: opacity .15s, transform .1s;
}
@media (prefers-color-scheme: dark) { button.submit { color: var(--bg); } }
button.submit:disabled { opacity: .25; cursor: not-allowed; }
button.submit:not(:disabled):active { transform: scale(.98); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
  background: var(--bad); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .9rem;
  box-shadow: 0 6px 24px rgba(0,0,0,.2); display: none; max-width: calc(100% - 32px);
}
.toast.show { display: block; }

.thanks {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.thanks.show { opacity: 1; pointer-events: auto; }
.thanks .check {
  width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff;
  display: grid; place-items: center; margin: 0 auto 14px; font-size: 2rem;
}
.thanks h2 { font-size: 1.4rem; font-weight: 650; }
.thanks p { color: var(--text-2); margin-top: 4px; }

@media (max-width: 560px) {
  header { flex-direction: column; }
  :root { --gap: 5px; --thumb-w: 36px; --thumb-h: 46px; --track-h: 18px; }
  .panel { padding: 12px 10px 14px; }
  .dim-q { font-size: 1.1rem; }
  .ends { font-size: .8rem; }
  .actions { flex-direction: column-reverse; align-items: stretch; text-align: center; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>How do you feel right now?</h1>
      <p class="lede">Tap or drag each slider to show how you feel.</p>
    </div>
    <details class="session" id="session">
      <summary><span class="status-dot" id="status-dot"></span><span id="session-summary">Session</span></summary>
      <div class="session-panel">
        <label>Participant ID <input type="text" id="in-participant" autocomplete="off" placeholder="e.g. P01"></label>
        <label>Trial / condition <input type="text" id="in-trial" autocomplete="off" placeholder="e.g. 1 or baseline"></label>
        <label class="check"><input type="checkbox" id="in-autoinc"> Auto-increment numeric trial after submit</label>
        <div class="meta" id="status-text">Checking connection…</div>
        <div class="meta">Publishes <code>/sam/rating</code>, <code>/sam/pad</code>, <code>/sam/events</code></div>
      </div>
    </details>
  </header>

  <main class="panel" id="dims"></main>

  <div class="actions">
    <span class="hint" id="hint">Answer all three questions to continue</span>
    <button class="submit" id="submit" disabled>Submit</button>
  </div>
</div>

<div class="thanks" id="thanks" aria-live="polite">
  <div><div class="check">✓</div><h2>Thank you</h2><p>Your answer has been saved.</p></div>
</div>
<div class="toast" id="toast" role="alert"></div>

<script>
// ── Questionnaire ────────────────────────────────────────────────────────
// Figures are photographed/illustrated SAM pictograms in web/img/, named
// <dimension>_<anchor>.png for anchor in 1..5 (installed from resource/png/
// via setup.py). Each question is a 9-point slider under its 5 pictograms:
// positions 1,3,5,7,9 sit under pictograms 1-5, the even ones between them.
const DIMS = [
  { id: 'valence', name: 'Pleasure', q: 'How unhappy or happy do you feel?',
    low: 'Unhappy · annoyed · sad', high: 'Happy · pleased · satisfied' },
  { id: 'arousal', name: 'Arousal', q: 'How calm or excited do you feel?',
    low: 'Calm · relaxed · sleepy', high: 'Excited · alert · stimulated' },
  { id: 'dominance', name: 'Dominance', q: 'How controlled or in control do you feel?',
    low: 'Controlled · influenced', high: 'In control · influential' },
];
const anchorOf = v => Math.round((v - 1) / 2) + 1; // scale value 1,3,5,7,9 -> pictogram 1..5
// Horizontal position of scale value v (1..9) inside a 5-column grid with
// --gap between columns: the centre of pictogram (v-1)/2, fractional for even v.
const posOf = v => { const a = (v - 1) / 2; return `calc((100% - 4 * var(--gap)) * ${(a + .5) / 5} + ${a} * var(--gap))`; };

const state = {};
let shownAt = 0, shownIso = '', nChanges = 0, submitting = false;
const $ = id => document.getElementById(id);

function build() {
  const main = $('dims');
  for (const d of DIMS) {
    const card = document.createElement('section');
    card.className = 'dim';
    let figs = '', ticks = '';
    for (let v = 1; v <= 9; v++) {
      if (v % 2) {
        figs += `<div class="fig" data-v="${v}" title="${v}">
          <img src="img/${d.id}_${anchorOf(v)}.png" alt="${d.name} ${v}" draggable="false"></div>`;
      }
      ticks += `<span class="tick ${v % 2 ? 'major' : ''}" style="left:${posOf(v)}"></span>`;
    }
    card.innerHTML = `
      <h2 class="dim-q" id="q-${d.id}">${d.q}</h2>
      <div class="figs">${figs}</div>
      <div class="slider unset" id="slider-${d.id}" role="slider" tabindex="0" aria-labelledby="q-${d.id}"
           aria-valuemin="1" aria-valuemax="9" aria-valuetext="not answered">
        <div class="track"></div><div class="thumb"></div></div>
      <div class="ticks" aria-hidden="true">${ticks}</div>
      <div class="ends"><span>${d.low}</span><span>${d.high}</span></div>`;
    main.appendChild(card);
    bindSlider(d, card);
  }
}

// Value under a pointer x position: inverse of posOf(), rounded to the
// nearest of the 9 positions.
function valueAt(slider, clientX) {
  const r = slider.getBoundingClientRect();
  const gap = parseFloat(getComputedStyle(slider).getPropertyValue('--gap')) || 0;
  const col = (r.width - 4 * gap) / 5;
  const a = (clientX - r.left - col / 2) / (col + gap);
  return Math.min(9, Math.max(1, Math.round(2 * a) + 1));
}

// The slider starts with no thumb, so there is no default value to anchor
// the answer and "not answered yet" can't be confused with a real 5. Tapping
// the track places the thumb there; dragging moves it in 9 steps. Only the
// position at release counts as a selection (one /sam/events "select" per
// release, not one per step while dragging).
function bindSlider(d, card) {
  const slider = card.querySelector('.slider');
  let dragValue = null;
  slider.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    slider.setPointerCapture(e.pointerId);
    slider.classList.add('dragging');
    slider.focus({ preventScroll: true });
    dragValue = valueAt(slider, e.clientX);
    show(d.id, dragValue);
  });
  slider.addEventListener('pointermove', e => {
    if (!slider.hasPointerCapture(e.pointerId)) return;
    const v = valueAt(slider, e.clientX);
    if (v !== dragValue) { dragValue = v; show(d.id, v); }
  });
  slider.addEventListener('pointerup', e => {
    if (!slider.hasPointerCapture(e.pointerId)) return;
    slider.releasePointerCapture(e.pointerId);
    slider.classList.remove('dragging');
    commit(d.id, dragValue);
  });
  slider.addEventListener('pointercancel', () => {
    slider.classList.remove('dragging');
    show(d.id, state[d.id]);
  });
  slider.addEventListener('keydown', e => {
    const cur = state[d.id];
    const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -2, PageUp: 2 }[e.key];
    let v;
    if (e.key === 'Home') v = 1;
    else if (e.key === 'End') v = 9;
    else if (step) v = cur == null ? 5 : Math.min(9, Math.max(1, cur + step));
    else return;
    e.preventDefault();
    commit(d.id, v);
  });
  // Tapping a pictogram puts the thumb under it.
  card.querySelectorAll('.fig').forEach(f => f.addEventListener('click', () => commit(d.id, +f.dataset.v)));
}

// Draw one question's slider at value v (null = no thumb).
function show(dim, v) {
  const slider = $('slider-' + dim);
  slider.classList.toggle('unset', v == null);
  slider.querySelector('.thumb').style.left = v == null ? '' : posOf(v);
  if (v == null) {
    slider.removeAttribute('aria-valuenow');
    slider.setAttribute('aria-valuetext', 'not answered');
  } else {
    slider.setAttribute('aria-valuenow', v);
    slider.setAttribute('aria-valuetext', String(v));
  }
  // Highlight the pictogram(s) the thumb is under: one for 1,3,5,7,9, the
  // two neighbours for an in-between value.
  slider.closest('.dim').querySelectorAll('.fig').forEach(f =>
    f.classList.toggle('near', v != null && Math.abs(+f.dataset.v - v) <= 1));
}

function commit(dim, v) {
  if (v === state[dim]) return show(dim, v);
  select(dim, v);
}

function select(dim, v) {
  state[dim] = v;
  nChanges++;
  show(dim, v);
  sendEvent({ type: 'select', dimension: dim, value: v });
  refresh();
  // Auto-publish as soon as all three questions are answered - no Submit
  // click needed. Only triggered here, from a real user selection, NEVER
  // from refresh() itself - submit() calls refresh() internally (to update
  // the button/hint while it's in flight and again when it's done), and if
  // the auto-submit check lived in refresh() that created a feedback loop:
  // submit()'s own finally-block refresh() would see all three answers
  // still set (reset() only clears them ~1.8s later, after the "Thank
  // you" message) and `submitting` already back to false, so it would
  // re-trigger submit() immediately, over and over, as fast as the HTTP
  // round-trip allowed. Gating this on a selection instead of on every
  // refresh() fixes that - submit() never calls select().
  if (DIMS.every(d => state[d.id] != null) && !submitting) submit();
}

function refresh() {
  const missing = DIMS.filter(d => state[d.id] == null).length;
  $('submit').disabled = missing > 0 || submitting;
  $('hint').textContent = missing ? `Answer ${missing === 3 ? 'all three questions' : missing + ' more question' + (missing > 1 ? 's' : '')} to continue` : 'Ready to submit';
}

function reset() {
  for (const d of DIMS) {
    delete state[d.id];
    show(d.id, null);
  }
  nChanges = 0;
  shownAt = Date.now();
  shownIso = new Date(shownAt).toISOString();
  refresh();
  sendEvent({ type: 'shown' });
  window.scrollTo({ top: 0 });
}

// ── Session (experimenter) settings ──────────────────────────────────────
const store = {
  get(k) { try { return localStorage.getItem('sam.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('sam.' + k, v); } catch {} },
};
const session = () => ({ participant: $('in-participant').value.trim(), trial: $('in-trial').value.trim() });

function initSession() {
  const url = new URLSearchParams(location.search);
  $('in-participant').value = url.get('participant') ?? store.get('participant') ?? '';
  $('in-trial').value = url.get('trial') ?? store.get('trial') ?? '1';
  $('in-autoinc').checked = (store.get('autoinc') ?? '1') === '1';
  for (const k of ['participant', 'trial']) {
    $('in-' + k).addEventListener('input', () => { store.set(k, $('in-' + k).value); showSession(); });
  }
  $('in-autoinc').addEventListener('change', e => store.set('autoinc', e.target.checked ? '1' : '0'));
  showSession();
}

function showSession() {
  const s = session();
  $('session-summary').textContent = [s.participant || 'No participant', s.trial && 'trial ' + s.trial].filter(Boolean).join(' · ');
}

// ── Talking to the ROS node ──────────────────────────────────────────────
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
}

function sendEvent(ev) {
  post('/api/event', { ...ev, ...session(), client_epoch_ms: Date.now() }).catch(() => {});
}

async function submit() {
  if ($('submit').disabled) return;
  submitting = true; refresh();
  const now = Date.now();
  const record = {
    ...session(),
    valence: state.valence, arousal: state.arousal, dominance: state.dominance,
    shown_at_iso: shownIso,
    submitted_at_iso: new Date(now).toISOString(),
    client_epoch_ms: now,
    response_time_ms: now - shownAt,
    n_changes: nChanges,
  };
  try {
    await post('/api/rating', record);
    sendEvent({ type: 'submit' });
    if ($('in-autoinc').checked && /^\d+$/.test(record.trial)) {
      $('in-trial').value = String(+record.trial + 1);
      store.set('trial', $('in-trial').value);
      showSession();
    }
    $('thanks').classList.add('show');
    setTimeout(() => { $('thanks').classList.remove('show'); reset(); }, 1800);
  } catch (e) {
    toast('Not saved: ' + e.message + ' — please tell the experimenter.');
  } finally {
    submitting = false; refresh();
  }
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
}

async function pollStatus() {
  const dot = $('status-dot'), text = $('status-text');
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    if (s.participant && !$('in-participant').value) {
      $('in-participant').value = s.participant; showSession();
    }
    const rec = s.subscribers > 0;
    dot.className = 'status-dot ' + (rec ? 'ok' : 'warn');
    text.textContent = `Connected to ${s.node}. ` + (rec
      ? `${s.subscribers} subscriber(s) on /sam/rating (recorder attached).`
      : 'No subscriber on /sam/rating — is ros2 bag record running?');
  } catch {
    dot.className = 'status-dot bad';
    text.textContent = 'Cannot reach the SAM ROS node.';
  }
}

$('submit').addEventListener('click', submit);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('session').open) submit(); });
build();
initSession();
reset();
pollStatus();
setInterval(pollStatus, 3000);
</script>
</body>
</html>
